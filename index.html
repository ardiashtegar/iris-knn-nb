<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediksi Spesies Iris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>

    <header>
      <h1>Prediksi Spesies Iris</h1>
      <p>Pilih model dan masukkan ukuran bunga untuk prediksi spesies</p>
      <div class="pilihan-model">
        <label><input type="radio" name="model" value="knn" checked><span>KNN</span></label>
        <label><input type="radio" name="model" value="gaussian"><span>Gaussian NB</span></label>
      </div>
      <p id="info-model"></p>
    </header>

    <div class="container">
      <form id="form-prediksi">
        <div class="input-group">
          <div class="field">
            <label for="sepal-length">Sepal length (cm)</label>
            <input type="number" id="sepal-length" step="any" min="0" placeholder="6.6" required>
          </div>
          <div class="field">
            <label for="sepal-width">Sepal width (cm)</label>
            <input type="number" id="sepal-width" step="any" min="0" placeholder="3.0" required>
          </div>
          <div class="field">
            <label for="petal-length">Petal length (cm)</label>
            <input type="number" id="petal-length" step="any" min="0" placeholder="5.5" required>
          </div>
          <div class="field">
            <label for="petal-width">Petal width (cm)</label>
            <input type="number" id="petal-width" step="any" min="0" placeholder="2.0" required>
          </div>
        </div>
        <button type="submit" id="tombol-prediksi">Prediksi</button>
      </form>

      <div class="hasil">
        <p id="hasil-spesies"></p>
        <p id="hasil-keterangan">Isi ukuran bunga, lalu klik Prediksi</p>
      </div>
    </div>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
